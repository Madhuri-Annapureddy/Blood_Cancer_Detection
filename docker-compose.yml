version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leukemia
      POSTGRES_PASSWORD: leukemia
      POSTGRES_DB: leukemia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://leukemia:leukemia@db:5432/leukemia
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
